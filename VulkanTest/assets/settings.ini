[window]
width = 1920
height = 1080
refresh_rate = 60
fullscreen = false
title = Vulkan Test
v_sync = false

[application]
debug_show_physics_colliders = false
debug_show_bounding_boxes = false
debug_show_normals = false
debug_render_lines = true
anisotropic_filtering = 16.0
texture_compression = true
shadow_map_resolution = 4096
enable_bloom = false
enable_hbao = true
lod_distances = 5, 15, 25, 35, 50

[game]
startScene = scenes/scene.xml
