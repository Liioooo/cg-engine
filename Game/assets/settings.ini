[window]
width = 1280
height = 720
refresh_rate = 60
fullscreen = false
title = Pac3D
icon = pacMan2D.png
v_sync = false

[application]
debug_show_physics_colliders = true
debug_show_bounding_boxes = true
debug_show_normals = true
debug_render_lines = true
anisotropic_filtering = 16.0
texture_compression = true
shadow_map_resolution = 4096
enable_bloom = true
enable_hbao = true
use_vulkan = false

[game]
startScene = scenes/start_scene.xml
